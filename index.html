let current=0;
const heading=document.getElementById('heading');
const lines=document.getElementById('lines');
const count=document.getElementById('count');
const progress=document.getElementById('progress');

slides.forEach((s,i)=>{
 const bar=document.createElement('span');
 progress.appendChild(bar);
});
function render(){
 const s=slides[current];
 heading.textContent=s[0];
 lines.innerHTML='';
 s[1].forEach(line=>{
  const p=document.createElement('p');
  p.textContent=line;
  lines.appendChild(p);
 });
 count.textContent=String(current+1).padStart(2,'0')+' / 18';
 [...progress.children].forEach((b,i)=>{
  b.classList.toggle('active',i<=current);
 });
 document.getElementById('prev').disabled=current===0;
 document.getElementById('next').textContent=
  current===17?'Replay ♡':'Next →';
}
document.getElementById('prev').onclick=()=>{
 if(current>0){current--;render()}
};
document.getElementById('next').onclick=()=>{
 current=current===17?0:current+1;render()
};
let startX=0;
document.querySelector('.story').addEventListener('touchstart',e=>{
 startX=e.changedTouches[0].screenX;
},{passive:true});
document.querySelector('.story').addEventListener('touchend',e=>{
 let diff=e.changedTouches[0].screenX-startX;
 if(Math.abs(diff)>50){
  current=diff<0?Math.min(17,current+1):Math.max(0,current-1);
  render();
 }
},{passive:true});
for(let i=0;i<18;i++){
 const h=document.createElement('span');
 h.className='heart';
 h.textContent=i%2?'♡':'♥';
 h.style.left=Math.random()*100+'%';
 h.style.animationDelay=Math.random()*7+'s';
 h.style.fontSize=(14+Math.random()*20)+'px';
 document.getElementById('hearts').appendChild(h);
}
render();
